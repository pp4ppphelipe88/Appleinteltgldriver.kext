name: Build AppleIntelTGLController Kext

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release Kext
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: |
          xcodebuild -version

      - name: Build Kext (Release)
        run: |
          set -o pipefail
          xcodebuild -project AppleIntelTGLController.xcodeproj \
                     -scheme AppleIntelTGLController \
                     -configuration Release \
                     -derivedDataPath build \
                     ARCHS=x86_64 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build 2>&1 | tee xcodebuild.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcodebuild-Failure-Log
          path: xcodebuild.log

      - name: Package Kext
        run: |
          cd build/Build/Products/Release
          zip -r AppleIntelTGLController-Release.zip AppleIntelTGLController.kext
          ls -la

      - name: Upload Kext Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleIntelTGLController-Release
          path: build/Build/Products/Release/AppleIntelTGLController.kext

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleIntelTGLController-Release-Zip
          path: build/Build/Products/Release/AppleIntelTGLController-Release.zip
